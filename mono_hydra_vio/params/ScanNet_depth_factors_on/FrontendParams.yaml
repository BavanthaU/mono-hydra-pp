%YAML:1.0
# TRACKER PARAMETERS
klt_win_size: 24
klt_max_iter: 40
klt_max_level: 3
klt_eps: 0.05
maxFeatureAge: 100

# Detector Params
# 0: FAST, 1: ORB, 2: AGAST, 3: GFTT
feature_detector_type: 3
maxFeaturesPerFrame: 500

# Good Features To Track specific parameters
quality_level: 0.005
min_distance: 15
block_size: 21
use_harris_detector: 0
k: 0.04

# FAST detector specific parameters
fast_thresh: 10
vision_sensor_type: 1  # RGBD
min_depth_factor: 0.1
map_depth_factor: 1.0

# Depth usage controls.
use_depth_stride: 0
depth_stride: 1
use_depth_gyro_gate: 0
depth_gyro_threshold_radps: 1.2
reuse_depth_on_skip: 0
reuse_max_angle_rad: 0.1
rgbd_sparse_depth_max_meas: 30

equalizeImage: 1
nominalBaseline: 0.10
toleranceTemplateMatching: 0.15
templ_cols: 101
templ_rows: 11
stripe_extra_rows: 0
minPointDist: 0.3
maxPointDist: 8
bidirectionalMatching: 0

# Non-maximum suppression params
max_nr_keypoints_before_anms: 3000
enable_non_max_suppression: 1
non_max_suppression_type: 6
nr_horizontal_bins: 10
nr_vertical_bins: 8
binning_mask: []

# Subpixel corner refinement
enable_subpixel_corner_finder: 1
max_iters: 30
epsilon_error: 0.002
window_size: 10
zero_zone: -1

subpixelRefinementStereo: 0
useSuccessProbabilities: 1
useRANSAC: 1
minNrMonoInliers: 10
minNrStereoInliers: 5
ransac_threshold_mono: 5e-04
ransac_threshold_stereo: 1e-01
ransac_use_1point_stereo: 0
ransac_use_2point_mono: 1
ransac_max_iterations: 500
ransac_probability: 0.995
ransac_randomize: 0
min_intra_keyframe_time: 0.15
max_intra_keyframe_time: 10.0
max_disparity_since_lkf: 100
minNumberFeatures: 40
useStereoTracking: 1
disparityThreshold: 0.5

# 0: Static, 1: Rotational
optical_flow_predictor_type: 0

# 2D-2D pose estimation
use_2d2d_tracking: 1
2d2d_algorithm: 1
optimize_2d2d_pose_from_inliers: 0

# 3D-3D pose estimation
use_3d3d_tracking: 1
optimize_3d3d_pose_from_inliers: 0

# 2D-3D pose estimation
use_pnp_tracking: 1
pnp_algorithm: 1
min_pnp_inliers: 20
ransac_threshold_pnp: 1.0
optimize_2d3d_pose_from_inliers: 0
