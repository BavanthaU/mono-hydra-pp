mavista:
  ros__parameters:
    # Empty model_path is not valid; omit it here to use the packaged model.
    provider: auto
    input_qos_reliability: best_effort
    input_image_topic: /camera/color/image_rect
    input_camera_info_topic: /camera/color/camera_info
    output_depth_topic: /hydra/camera/depth/image_rect
    output_semantic_topic: /hydra/camera/semantic/image_raw
    output_semantic_visualization_topic: /mavista/semantic/visualization
    output_semantic_confidence_topic: /mavista/semantic/confidence
    semantic_confidence_threshold: 0.0
    min_depth_m: 0.1
    max_depth_m: 10.0
    sync_slop_s: 0.03
    publish_diagnostics: false
    publish_semantic_visualization: false
