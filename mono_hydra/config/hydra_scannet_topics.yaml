---
tf:
  verbosity: 1
input:
  type: RosInput
  clear_queue_on_fail: true
  tf_lookup:
    wait_duration_s: 0.1
    buffer_size_s: 120.0
    max_tries: 30
    verbosity: 2
  inputs:
    camera:
      receiver:
        type: ClosedSetImageReceiver
        queue_size: 30
      sensor:
        type: camera_info
        min_range: 0.05
        max_range: 8.0
        extrinsics:
          type: ros
          robot_frame: base_link_kimera
map_window:
  type: spatial
  max_radius_m: 8.0
active_window:
  full_update_separation_s: 0.2
  volumetric_map:
    voxels_per_side: 16
    voxel_size: 0.1
    truncation_distance: 0.3
  tsdf:
    semantic_integrator:
      type: MLESemanticIntegrator
frontend:
  type: GraphBuilder
  pose_graph_tracker:
    type: RosPoseGraphs
    ns: /mono_hydra_vio_ros
    queue_size: 1000
  pgmo:
    time_horizon: 15.0
    d_graph_resolution: 2.5
    mesh_resolution: 0.02
  objects:
    min_cluster_size: 40
    cluster_tolerance: 0.25
    bounding_box_type: RAABB
  surface_places:
    type: place_2d
    prefix: P
    pure_final_place_size: 3
    enable_place_purity: false
    impure_final_place_size: 1
    cluster_tolerance: 0.3
    min_cluster_size: 50
    max_cluster_size: 100000
    min_final_place_points: 10
    place_max_neighbor_z_diff: 0.5
    place_overlap_threshold: 0.0
  freespace_places:
    type: gvd
    filter_places: true
    min_places_component_size: 3
    filter_ground: false
    gvd:
      max_distance_m: 4.5
      min_distance_m: 0.2
      min_diff_m: 0.1
      voronoi_config:
        mode: L1_THEN_ANGLE
        min_distance_m: 0.30
        parent_l1_separation: 20
        parent_cos_angle_separation: 0.2
    graph:
      type: CompressionGraphExtractor
      compression_distance_m: 1.5
      min_node_distance_m: 0.4
      min_edge_distance_m: 0.25
      node_merge_distance_m: 0.7
      merge_policy: distance
    tsdf_interpolator:
      type: downsample
      ratio: 2
  use_frontiers: false
backend:
  type: BackendModule
  serialize_dsg_mesh: true
  min_dsg_separation_s: 1.0
  publish_mesh: true
  min_mesh_separation_s: 2.0
  add_places_to_deformation_graph: true
  optimize_on_lc: true
  enable_node_merging: true
  external_loop_closures:
    max_time_difference: 1.0
  update_functors:
    agents: {type: UpdateAgentsFunctor}
    objects: {type: UpdateObjectsFunctor}
    surface_places: {type: Update2dPlacesFunctor, min_size: 3}
    places:
      type: UpdatePlacesFunctor
      pos_threshold_m: 0.35
      distance_tolerance_m: 0.25
    rooms:
      type: UpdateRoomsFunctor
      room_finder:
        min_dilation_m: 0.5
        max_dilation_m: 1.2
        min_window_size: 0.2
        clip_dilation_window_to_max: false
        min_component_size: 10
        min_room_size: 10
        dilation_threshold_mode: PLATEAU
        min_lifetime_length_m: 0.3
        plateau_ratio: 0.35
        clustering_mode: NEIGHBORS
        max_modularity_iters: 5
        modularity_gamma: 1.0
        dilation_diff_threshold_m: 1.0e-03
        log_filtrations: false
        log_place_graphs: false
    buildings:
      type: UpdateBuildingsFunctor
      semantic_label: 22
  pgmo:
    run_mode: FULL
    embed_trajectory_delta_t: 5.0
    num_interp_pts: 3
    interp_horizon: 10.0
    add_initial_prior: true
    optimizer:
      type: KimeraRpgoOptimizer
      solver: LM
      gnc:
        inlier_probability: 0.9
        mu_step: 1.6
        max_iterations: 100
    covariance:
      odom: 1.0e-02
      loop_close: 5.0e-02
      sg_loop_close: 1.0e-01
      prior: 1.0e-02
      mesh_mesh: 1.0e-02
      pose_mesh: 1.0e-02
      place_mesh: 1.0e-02
      place_edge: 10.0
      place_merge: 10.0
      object_merge: 10.0
