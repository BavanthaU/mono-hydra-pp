---
tf:
  verbosity: 1
input:
  type: RosInput
  clear_queue_on_fail: true
  tf_lookup:
    wait_duration_s: 0.05
    buffer_size_s: 120.0
    max_tries: 80
    verbosity: 2
  inputs:
    camera:
      receiver:
        type: ClosedSetImageReceiver
        queue_size: 3000
      sensor:
        type: camera_info
        min_range: 0.1
        max_range: 5.0
        extrinsics:
          type: ros
          sensor_frame: left_cam_kimera
          robot_frame: base_link_kimera
          wait_duration_s: 0.05
          warning_timeout_s: 10.0
          error_timeout_s: 0.0
          verbosity: 3
map_window:
  type: spatial
  max_radius_m: 8.0
active_window:
  full_update_separation_s: 0.2
  volumetric_map:
    voxels_per_side: 16
    voxel_size: 0.05
    truncation_distance: 0.15
  mesh:
    min_weight: 0.001
    integrator_threads: -1
  tsdf:
    verbosity: 1
    num_threads: -1
    interpolation_method: bilinear
    semantic_integrator:
      type: MLESemanticIntegrator
frontend:
  type: GraphBuilder
  pose_graph_tracker:
    type: RosPoseGraphs
    ns: /mono_hydra_vio_ros
    queue_size: 1000
  pgmo:
    time_horizon: 15.0
    d_graph_resolution: 2.5
    mesh_resolution: 0.005
  objects:
    prefix: O
    active_horizon_s: 10.0
    active_index_horizon_m: 7.0
    min_cluster_size: 80
    max_cluster_size: 100000
    cluster_tolerance: 0.2
    bounding_box_type: RAABB
  min_object_vertices: 80
  surface_places:
    type: place_2d
    prefix: P
    pure_final_place_size: 1
    cluster_tolerance: 0.2
    min_cluster_size: 50
    max_cluster_size: 100000
    min_final_place_points: 20
    place_max_neighbor_z_diff: 0.5
    place_overlap_threshold: 0.0
  freespace_places:
    type: gvd
    filter_places: true
    min_places_component_size: 3
    filter_ground: false
    gvd:
      max_distance_m: 5.0
      min_distance_m: 0.1
      min_diff_m: 0.1
      min_weight: 1.0e-6
      positive_distance_only: true
      min_basis_for_extraction: 1
      num_buckets: 20
      multi_queue: false
      extract_graph: true
      voronoi_config:
        mode: L1_THEN_ANGLE
        min_distance_m: 0.12
        parent_l1_separation: 20
        parent_cos_angle_separation: 0.2
    graph:
      type: CompressionGraphExtractor
      compression_distance_m: 1.5
      validate_graph: false
      min_node_distance_m: 0.4
      min_edge_distance_m: 0.25
      node_merge_distance_m: 0.7
      add_heuristic_edges: false
      add_overlap_edges: true
      overlap_edges:
        num_neighbors_to_check: 4
        min_clearance_m: 0.4
      add_freespace_edges: false
      merge_policy: distance
    tsdf_interpolator:
      type: downsample
      ratio: 2
  use_frontiers: false
  frontier_places:
    type: voxel_clustering
    cluster_tolerance: 0.3
    min_cluster_size: 10
    max_cluster_size: 100000
    max_place_radius: 5
    dense_frontiers: false
    frontier_splitting_threshold: 0.2
    point_threshold: 10
    recent_block_distance: 25
    minimum_relative_z: -1.0
    maximum_relative_z: 1.0
backend:
  type: BackendModule
  serialize_dsg_mesh: true
  min_dsg_separation_s: 1.0
  publish_mesh: true
  min_mesh_separation_s: 2.0
  add_places_to_deformation_graph: true
  optimize_on_lc: true
  enable_node_merging: true
  external_loop_closures:
    max_time_difference: 1.0
  update_functors:
    agents:
      type: UpdateAgentsFunctor
    objects:
      type: UpdateObjectsFunctor
    surface_places:
      type: Update2dPlacesFunctor
      allow_places_merge: true
      merge_max_delta_z: 0.5
      min_points: 10
      min_size: 2
      connection_overlap_threshold: 0
      connection_max_delta_z: 0.5
    places:
      type: UpdatePlacesFunctor
      pos_threshold_m: 0.3
      distance_tolerance_m: 0.3
    rooms:
      type: UpdateRoomsFunctor
      room_finder:
        min_dilation_m: 0.5
        max_dilation_m: 1.2
        min_window_size: 0.2
        clip_dilation_window_to_max: false
        min_component_size: 10
        min_room_size: 10
        dilation_threshold_mode: PLATEAU
        min_lifetime_length_m: 0.3
        plateau_ratio: 0.35
        clustering_mode: NEIGHBORS
        max_modularity_iters: 5
        modularity_gamma: 1.0
        dilation_diff_threshold_m: 1.0e-03
        log_filtrations: false
        log_place_graphs: false
    buildings:
      type: UpdateBuildingsFunctor
      semantic_label: 22
  pgmo:
    run_mode: FULL
    embed_trajectory_delta_t: 5.0
    num_interp_pts: 3
    interp_horizon: 10.0
    add_initial_prior: true
    optimizer:
      type: KimeraRpgoOptimizer
      solver: LM
      gnc:
        inlier_probability: 0.9
        mu_step: 1.6
        max_iterations: 100
    covariance:
      odom: 1.0e-02
      loop_close: 5.0e-02
      sg_loop_close: 1.0e-01
      prior: 1.0e-02
      mesh_mesh: 1.0e-02
      pose_mesh: 1.0e-02
      place_mesh: 1.0e-03
      place_edge: 10.0
      place_merge: 10.0
      object_merge: 10.0
