---
# ITC Hydra reconstruction profile.
# Kept identical to the shared drone profile for now so only ITC backend/room
# behavior changes.
map:
  voxels_per_side: 16
  voxel_size: 0.05
  truncation_distance: 0.15
dense_representation_radius_m: 8.0
mesh:
  min_weight: 0.001
  integrator_threads: -1
tsdf:
  verbosity: 1
  num_threads: -1
  interpolation_method: bilinear
  semantic_integrator:
    type: MLESemanticIntegrator
